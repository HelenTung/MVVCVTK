name: Windows x64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-sdk:
    # 固定 v145、桌面 OpenGL 与内部 UI 依赖要求使用受控 Windows runner。
    runs-on: [self-hosted, Windows, X64, mvvcvtk-v145]
    timeout-minutes: 150
    env:
      DEPS_VERSION: 2026.08.21-deps.1
      MVVCVTK_DEPS_URI: ${{ secrets.MVVCVTK_DEPS_URI }}

    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Bootstrap locked dependencies
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MVVCVTK_DEPS_URI)) {
            throw 'Repository secret MVVCVTK_DEPS_URI is required.'
          }
          ./tools/deps/Get-MVVCVTKDependencies.ps1 `
            -Uri $env:MVVCVTK_DEPS_URI -Force

      - name: Resolve toolchain and runtime
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * `
            -requires Microsoft.Component.MSBuild `
            -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild was not found.' }
          "MSBUILD_PATH=$msbuild" | Add-Content $env:GITHUB_ENV
          $deps = Join-Path $env:GITHUB_WORKSPACE `
            "sdk\deps\$env:DEPS_VERSION-win-x64"
          @(
            "$deps\ui\bin",
            "$deps\opencv\x64\vc16\bin",
            "$deps\vtk\bin",
            "$deps\qt\bin"
          ) | Add-Content $env:GITHUB_PATH
          "QT_PLUGIN_PATH=$deps\qt\plugins" | Add-Content $env:GITHUB_ENV

      - name: Build x64 Debug and Release
        shell: pwsh
        run: |
          foreach ($configuration in @('Debug', 'Release')) {
            & $env:MSBUILD_PATH ./MVVCVTK.sln /m /t:Rebuild `
              /p:Configuration=$configuration /p:Platform=x64 `
              /p:ImportUserProps=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $env:MSBUILD_PATH ./test/MVVCVTK.Tests.sln /m /t:Rebuild `
              /p:Configuration=$configuration /p:Platform=x64 `
              /p:ImportUserProps=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            foreach ($project in @(
                './test/QtHost/QtHostMethodTests.vcxproj',
                './test/QtHost/QtHostSessionSmoke.vcxproj')) {
              & $env:MSBUILD_PATH $project /m /t:Rebuild `
                /p:Configuration=$configuration /p:Platform=x64 `
                /p:ImportUserProps=false
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      - name: Run all x64 tests
        shell: pwsh
        run: |
          foreach ($configuration in @('Debug', 'Release')) {
            $tests = @(
              "./test/x64/$configuration/PlanarCropTests.exe",
              "./test/x64/$configuration/GapAnalysisAlgorithmTests.exe",
              "./test/Interaction/x64/$configuration/InteractionRouterTests.exe",
              "./test/QtHost/x64/$configuration/QtHostMethodTests.exe",
              "./test/QtHost/x64/$configuration/QtHostSessionSmoke.exe"
            )
            foreach ($test in $tests) {
              & $test
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      - name: Verify and package clean-room SDK
        shell: pwsh
        run: |
          $version = (Get-Date -Format 'yyyy.MM.dd') `
            + '-rev.' + '${{ github.run_number }}'
          & $env:MSBUILD_PATH ./MVVCVTK/MVVCVTK.vcxproj /m:1 `
            /t:VerifyCleanRoom /p:Platform=x64 `
            /p:ImportUserProps=false /p:MVVCVTKSdkVersion=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $artifactRoot = Join-Path $env:RUNNER_TEMP `
            'MVVCVTK-sdk-${{ github.run_id }}'
          if (Test-Path -LiteralPath $artifactRoot) {
            Remove-Item -LiteralPath $artifactRoot -Recurse -Force
          }
          [void](New-Item -ItemType Directory -Path $artifactRoot)
          $archive = "MVVCVTK-SDK-$version-win-x64.zip"
          Copy-Item -LiteralPath "./sdk/packages/$archive" `
            -Destination $artifactRoot
          Copy-Item -LiteralPath "./sdk/packages/$archive.sha256" `
            -Destination $artifactRoot

      - name: Publish SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MVVCVTK-SDK-${{ github.run_number }}-win-x64
          path: ${{ runner.temp }}/MVVCVTK-sdk-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
