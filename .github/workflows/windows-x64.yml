name: Windows x64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-sdk:
    # 固定 v145、桌面 OpenGL 与内部 UI 依赖要求使用受控 Windows runner。
    runs-on: [self-hosted, Windows, X64, mvvcvtk-v145]
    timeout-minutes: 150
    env:
      MVVCVTK_DEPS_URI: ${{ secrets.MVVCVTK_DEPS_URI }}
      MVVCVTK_DEFX_ROOT: ${{ vars.MVVCVTK_DEFX_ROOT }}

    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Bootstrap locked dependencies
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MVVCVTK_DEPS_URI)) {
            throw 'Repository secret MVVCVTK_DEPS_URI is required.'
          }
          ./tools/Get-MVVCVTKDependencies.ps1 `
            -Uri $env:MVVCVTK_DEPS_URI -Force

      - name: Resolve runtime
        shell: pwsh
        run: |
          $deps = Join-Path $env:GITHUB_WORKSPACE 'deps\official'
          @(
            "$deps\ui\bin",
            "$deps\opencv\x64\vc16\bin",
            "$deps\vtk\bin",
            "$deps\qt\bin"
          ) | Add-Content $env:GITHUB_PATH
          "QT_PLUGIN_PATH=$deps\qt\plugins" | Add-Content $env:GITHUB_ENV
          $defxRoot = $env:MVVCVTK_DEFX_ROOT
          if ([string]::IsNullOrWhiteSpace($defxRoot)) {
            $defxRoot = Join-Path $env:GITHUB_WORKSPACE `
              'deps\third_party\defx'
          }
          foreach ($required in @(
              'include\DefXAnalysisService.h',
              'include\DefXTypes.h',
              'bin\Debug\DefXAnalysis.dll',
              'lib\Debug\DefXAnalysis.lib',
              'bin\Release\DefXAnalysis.dll',
              'lib\Release\DefXAnalysis.lib')) {
            if (-not (Test-Path -LiteralPath (Join-Path $defxRoot $required))) {
              throw "DefX environment is incomplete: $defxRoot"
            }
          }
          "MVVCVTK_DEFX_ROOT=$defxRoot" | Add-Content $env:GITHUB_ENV

      - name: Generate Visual Studio solution and build x64
        shell: pwsh
        run: |
          cmake --preset vs2026-x64 `
            "-DMVVCVTK_DEFX_ROOT=$env:MVVCVTK_DEFX_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset vs2026-debug --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset vs2026-release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run CTest Debug and Release
        shell: pwsh
        run: |
          ctest --preset vs2026-debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --preset vs2026-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and package clean-room SDK
        shell: pwsh
        run: |
          $gitShort = git rev-parse --short=12 HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Date -Format 'yyyy.MM.dd') + '-git.' + $gitShort
          ./tools/release/Build-MVVCVTKSdk.ps1 `
            -PackageRevision $version `
            -DefXRoot $env:MVVCVTK_DEFX_ROOT -SkipTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $artifactRoot = Join-Path $env:RUNNER_TEMP `
            'MVVCVTK-sdk-${{ github.run_id }}'
          if (Test-Path -LiteralPath $artifactRoot) {
            Remove-Item -LiteralPath $artifactRoot -Recurse -Force
          }
          [void](New-Item -ItemType Directory -Path $artifactRoot)
          $archive = "MVVCVTK-SDK-$version-win-x64.zip"
          Copy-Item -LiteralPath "./out/packages/$archive" `
            -Destination $artifactRoot

      - name: Publish SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MVVCVTK-SDK-${{ github.run_number }}-win-x64
          path: ${{ runner.temp }}/MVVCVTK-sdk-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
